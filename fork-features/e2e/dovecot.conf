# Layered on the dovecot/dovecot image's own config (mounted as conf.d/zz-e2e.conf).
# The certificate and the optional rawlog / mail_debug includes are written into the
# /run/e2e tmpfs by the container command in compose.yml.

ssl_server {
  cert_file = /run/e2e/tls.crt
  key_file = /run/e2e/tls.key
}

# MailFlow holds several connections per account, and seed may add both endpoints for
# one mail user from the same backend address.
protocol imap {
  mail_max_userip_connections = 100
}

# The degraded endpoint is the same server reached under the name dovecot-degraded:
# Dovecot picks these settings from the TLS SNI. Only the advertisement changes —
# COPYUID/APPENDUID response codes are still sent and an unadvertised MOVE still works.
local_name dovecot-degraded {
  protocol imap {
    imap4rev2_enable = no
    imap_capability {
      MOVE = no
      UIDPLUS = no
    }
  }
}

!include_try /run/e2e/*.conf
